# ox-browser configuration
# All values shown are defaults. Uncomment and modify as needed.
# Priority: defaults → config.toml → env vars → CLI args.

[server]
# port = 8901
# bind = "0.0.0.0"
# Extra Host authorities admitted on every route (DNS-rebinding guard); loopback
# is always admitted on any port, so an empty list means loopback only. An entry
# is a name or address, optionally with a port ("name", "name:8901", "[::1]:8901");
# a bare name admits any port, case-insensitive, no wildcards. Also settable via
# OX_ALLOWED_HOSTS (comma-separated; the older OX_MCP_ALLOWED_HOSTS and the
# mcp_allowed_hosts key are still read and merged). OX_HOST_GUARD_MODE=report
# logs and counts a disallowed Host but lets it through (rollout aid); default enforce.
# allowed_hosts = ["private-addr:8901"]

[http]
# timeout_secs = 20
# max_redirects = 10
# Browser profile: chrome, firefox, safari, edge, none.
# One name yields TLS + HTTP/2 + headers + UA + client hints atomically.
profile = "chrome"

[retry]
# max_retries = 3
# initial_wait_ms = 500
# max_wait_ms = 10000
# multiplier = 2.0
# jitter_pct = 0.3

[cache]
# cookie_ttl_secs = 1500   # 25 minutes

[proxy]
# url = ""                         # or set PROXY_URL env var
# webshare_timeout_secs = 10

[proxy.health]
# failure_threshold = 0.5          # 50% failure rate to deactivate
# min_requests = 3                 # min requests before threshold evaluated
# cooldown_secs = 300              # 5 minutes

[solver]
# byparr_url = ""                  # or set BYPARR_URL env var
byparr_timeout_secs = 120          # FlareSolverr cold start can take ~70s
chromium_enabled = false            # Byparr (Camoufox) works on ARM64 with pinned tag
# chromium_path auto-detected via CHROME_PATH env var
chromium_max_concurrent = 2
chromium_timeout_secs = 30

[cloudflare]
# detect = true

[ratelimit]
# Per-host rate limits, first matching rule wins. A `[[ratelimit.rules]]` list
# REPLACES the built-in defaults (reddit, x.com, finance.yahoo.com, catch-all),
# so copy every rule you want to keep. Keys per rule:
#   domain              "api.x.com" exact, "*.x.com" any subdomain (not the apex),
#                       "" catch-all (keep it last)
#   requests_per_window burst size, and the refill per window_secs
#   window_secs         the bucket refills requests_per_window permits over this long
#   min_delay_ms        minimum gap between two requests to the same host (default 0)
#   random_delay_ms     extra random gap, 0..random_delay_ms (default 0)
# Bounds (rejected at startup otherwise): requests_per_window 1..=100000, window_secs 1..=86400,
# delays <= 3600000 ms, domain in [a-z0-9.-] (optionally "*." prefixed), unknown keys refused.
# Token bucket: requests_per_window may go out at once, then permits return at
# requests_per_window / window_secs. A call whose permit is due after its own
# `timeout` is refused at once with 429 + Retry-After instead of timing out.
# Metrics: oxbrowser_ratelimit_wait_seconds{rule}, oxbrowser_ratelimit_deadline_refusals_total{rule}.
#
# [[ratelimit.rules]]
# domain = "*.finance.yahoo.com"   # JSON finance APIs: burst 120, then 2 req/s
# requests_per_window = 120
# window_secs = 60
# min_delay_ms = 0
# random_delay_ms = 50
#
# [[ratelimit.rules]]
# domain = ""                      # catch-all
# requests_per_window = 30
# window_secs = 60
# min_delay_ms = 200
# random_delay_ms = 100

[fetch]
# default_timeout_secs = 15       # /fetch endpoint default
# smart_timeout_secs = 30          # /fetch-smart endpoint default

[images]
# default_max_results = 10         # /images/search default
# default_min_width = 400          # /images/extract min width (px)
# min_dimension = 200              # extraction filter: skip images < this (px)
# rrf_k = 60.0                    # Reciprocal Rank Fusion constant

[media]
# default_max_height = 1080        # max video height (px)
# default_max_size_mb = 50.0       # max file size (MB)
# default_max_results = 1          # max results for generic extraction
# innertube_url = "https://www.youtube.com/youtubei/v1/player"
# android_vr_version = "1.60.19"   # ANDROID_VR client version
# proxy_url = ""                   # set via MEDIA_PROXY_URL env var

[log]
# level = "info"                   # info, debug, warn, error, trace

[twitter]
login_timeout_secs = 90
max_concurrent_logins = 1
screenshot_on_error = true
screenshot_dir = "/tmp/ox-browser/twitter-login"

[chrome]
max_concurrent = 2
timeout_secs = 30
screenshot_dir = "/tmp/ox-browser/chrome"
