[package]
name = "ox-twitter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ox-http = { path = "../http" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wreq = { version = "6.0.0-rc.28", default-features = false, features = ["cookies", "gzip", "brotli", "json", "query"] }
wreq-util = "3.0.0-rc.10"
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
sha2 = "0.10"
base64 = "0.22"
regex = "1"
rand = "0.8"
once_cell = "1"
rand_distr = "0.4"
chrono = "0.4"
