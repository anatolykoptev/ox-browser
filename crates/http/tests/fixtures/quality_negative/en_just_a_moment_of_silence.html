<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Just a moment of silence…</title></head><body><main><h1>Just a moment of silence…</h1><p>The council observed a moment of silence before the vote on Monday evening, remembering the former mayor who died last week, and members from every party spoke about his decades of public service.</p><p>The vote itself passed without debate.</p></main></body></html>
