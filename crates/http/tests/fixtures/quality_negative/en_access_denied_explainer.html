<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Access denied errors explained</title></head><body><main><h1>Access denied errors explained</h1><p>An access denied message appears when the account you are using lacks the permission needed to open a resource, and the quickest fix is to ask the owner of the resource to share it with you.</p><p>Administrators can audit these events in the activity log.</p></main></body></html>
