[package]
name = "ox-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["quickjs"]
# QuickJS sandbox for executing inline <script> tags to recover SPA data blobs
# (window.__PRELOADED_STATE__, Next.js self.__next_f). Links a C library —
# disabled on wasm32 targets.
quickjs = ["rquickjs"]
# Fingerprint oracle test — verifies TLS/HTTP2 fingerprint matches the
# claimed browser. Requires network access. Run explicitly:
#   cargo test -p ox-http --features fingerprint --test fingerprint_oracle_test
fingerprint = []
# SOCKS proxy support in wreq. DELIBERATELY GUARDED against — the dial-failure
# classifier's precision argument (proxy_fallback::looks_like_proxy_dial_failure)
# assumes socks is NOT compiled, because socks proxy errors surface as
# `is_proxy_connect()` and would falsify the "proxy-dial failure" classification.
# Enabling this feature triggers a compile_error in proxy_fallback.rs.
socks = ["wreq/socks"]

[dependencies]
wreq = { version = "6.0.0-rc.29", features = ["cookies", "gzip", "brotli", "zstd", "stream"] }
wreq-util = "3.0.0-rc.12"
cookie_store = "0.21"
url = "2"
async-trait = "0.1"
futures-util = "0.3"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dom_query = "0.27"
htmd = "0.5"
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
flate2 = "1"

# rquickjs links a C library (QuickJS) and cannot build for wasm32.
# Gating per target keeps the crate WASM-safe even with default features.
# Pinned to =0.12.1: 0.12.2 published 2026-07-27 (<7 days), 0.12.1 is 21 days old.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { version = "=0.12.1", default-features = true, optional = true }

[dev-dependencies]
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
