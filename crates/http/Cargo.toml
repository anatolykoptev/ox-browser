[package]
name = "ox-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["quickjs"]
# QuickJS sandbox for executing inline <script> tags to recover SPA data blobs
# (window.__PRELOADED_STATE__, Next.js self.__next_f). Links a C library —
# disabled on wasm32 targets.
quickjs = ["rquickjs"]

[dependencies]
wreq = { version = "6.0.0-rc.28", default-features = false, features = ["cookies", "gzip", "brotli"] }
wreq-util = "3.0.0-rc.10"
cookie_store = "0.21"
url = "2"
async-trait = "0.1"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
readabilityrs = "0.1"
dom_query = "0.27"
htmd = "0.5"
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"

# rquickjs links a C library (QuickJS) and cannot build for wasm32.
# Gating per target keeps the crate WASM-safe even with default features.
# Pinned to =0.12.1: 0.12.2 published 2026-07-27 (<7 days), 0.12.1 is 21 days old.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { version = "=0.12.1", default-features = true, optional = true }

[dev-dependencies]
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
