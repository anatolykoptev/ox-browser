[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # fxhash — unmaintained; transitive dep via dom_query, no upgrade path yet
    "RUSTSEC-2025-0057",
    # rand unsoundness with custom global logger — not applicable (we don't set a custom rand logger)
    "RUSTSEC-2026-0097",
    # rustls name constraints URI (x509) — transitive via wreq; update when wreq ships fix
    "RUSTSEC-2026-0098",
    # rustls name constraints wildcard — same as above
    "RUSTSEC-2026-0099",
    # rustls CRL parsing panic — same as above
    "RUSTSEC-2026-0104",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "LGPL-3.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Workspace crates have no published license field — skip them.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["anatolykoptev"]
gitlab = []
bitbucket = []
