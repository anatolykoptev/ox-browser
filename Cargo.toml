[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/http",
    "crates/intelligence",
    "crates/js",
    "crates/security",
    "crates/crawler",
    "crates/imagesearch",
    "crates/mcp",
    "crates/media",
    "crates/reverse",
    "crates/twitter",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/anatolykoptev/ox-browser"
authors = ["Anatoly Koptev"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "ox-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ox-core = { path = "crates/core" }
ox-http = { path = "crates/http" }
ox-js = { path = "crates/js" }
ox-crawler = { path = "crates/crawler" }
ox-media = { path = "crates/media" }
ox-mcp = { path = "crates/mcp" }
ox-twitter = { path = "crates/twitter" }
axum = "0.8"
async-trait = "0.1"
wreq-util = "3.0.0-rc.10"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
wreq = { version = "6.0.0-rc.28", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
