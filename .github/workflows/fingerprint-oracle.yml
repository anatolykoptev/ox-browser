name: Fingerprint oracle

# Scheduled live self-check of the RELEASED ox-browser binary via the
# `doctor` subcommand (issue #109). `doctor` lives inside the binary and
# measures the client the service builds (`HttpClient::new` through the
# shared CLI seam), against the embedded reference — so the artifact under
# test IS the artifact that ships, including in the production container.
#
# This workflow must NEVER block a merge — it is not in preflight and has no
# push/PR trigger. A flaky echo service cannot be allowed to block CI.
#
# Three outcomes from `doctor --json` (structured, on stdout):
#   - fail  → real fingerprint drift / invalid config. Non-zero exit. Files
#             or updates a `fingerprint-drift` issue with expected-vs-observed
#             fields taken from the JSON (no string-matching classifier).
#   - warn  → reference >90 days old, solver/proxy unset. Zero exit. Not drift.
#   - skip  → echo service unreachable / unparseable. Zero exit. NOT drift —
#             retries once, then reports an infrastructure skip and files NO
#             drift issue.
#   - pass  → all fields match. Zero exit. Closes a stale drift issue if open.
#
# The outage/drift/fail distinction comes from the structured verdict, not
# from grepping panic strings out of stderr (the old classifier broke if an
# `eprintln!` changed). See issue #109 and `src/doctor.rs`.

on:
  schedule:
    # Weekly Monday 04:17 UTC — off-hour to reduce echo-service load.
    # GitHub Actions scheduled workflows run only on the default branch.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: fingerprint-oracle
  cancel-in-progress: true

jobs:
  oracle:
    name: Live fingerprint oracle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # ── Download the RELEASED binary ───────────────────────────────────
      #
      # The whole point of issue #109: measure the *released* binary, not a
      # fresh build of `main`. The release workflow (release.yml) publishes
      # `ox-browser-linux-aarch64.tar.gz` as a release asset for every `v*`
      # tag; this runner is `ubuntu-24.04-arm` so the aarch64 binary runs
      # natively. Downloading the latest release measures exactly what an
      # operator who `gh release download`'d today would run. Building here
      # would measure `main`, which is not what ships.
      - name: Download released binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/oxb
          gh release download --pattern "ox-browser-linux-aarch64.tar.gz" -D /tmp/oxb
          tar -xzf /tmp/oxb/ox-browser-linux-aarch64.tar.gz -C /tmp/oxb
          chmod +x /tmp/oxb/ox-browser
          /tmp/oxb/ox-browser --version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Run doctor (attempt 1) ─────────────────────────────────────────
      #
      # `doctor --json` emits the structured verdict on stdout (captured to
      # /tmp/doctor1.json) and human-readable metadata on stderr (captured to
      # /tmp/doctor1.stderr.log). continue-on-error so a `fail` (non-zero
      # exit) does not abort the workflow before classification.
      - name: Run doctor (attempt 1)
        id: doctor1
        continue-on-error: true
        run: |
          set -o pipefail
          /tmp/oxb/ox-browser doctor --json > /tmp/doctor1.json 2> /tmp/doctor1.stderr.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # ── Classify attempt 1 from the structured verdict ─────────────────
      - name: Classify (attempt 1)
        id: classify
        run: |
          python3 - <<'PY'
          import json, os
          with open("/tmp/doctor1.json") as f:
            report = json.load(f)
          verdict = report.get("verdict", "fail")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"verdict={verdict}\n")
          print(f"verdict={verdict}")
          PY

      # ── Retry on skip (echo-service outage) ────────────────────────────
      - name: Retry on skip (attempt 2)
        id: doctor2
        if: steps.classify.outputs.verdict == 'skip'
        continue-on-error: true
        run: |
          set -o pipefail
          /tmp/oxb/ox-browser doctor --json > /tmp/doctor2.json 2> /tmp/doctor2.stderr.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Reclassify after retry
        id: reclassify
        if: steps.classify.outputs.verdict == 'skip'
        run: |
          python3 - <<'PY'
          import json, os
          with open("/tmp/doctor2.json") as f:
            report = json.load(f)
          verdict = report.get("verdict", "skip")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"verdict={verdict}\n")
          print(f"verdict={verdict}")
          PY

      # ── Resolve the final verdict + report ─────────────────────────────
      #
      # Pick the report to act on: if a retry ran, use attempt 2; else
      # attempt 1. Then branch on the final verdict.
      - name: Resolve final verdict
        id: final
        run: |
          python3 - <<'PY'
          import json, os
          path = "/tmp/doctor2.json" if os.path.exists("/tmp/doctor2.json") and "${{ steps.classify.outputs.verdict }}" == "skip" else "/tmp/doctor1.json"
          with open(path) as f:
              report = json.load(f)
          verdict = report.get("verdict", "fail")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"verdict={verdict}\n")
              f.write(f"report={path}\n")
          # Extract reference provenance from the fingerprint check's first
          # profile (the embedded reference the binary measured against).
          fp = next((c for c in report.get("checks", []) if c.get("name") == "fingerprint"), {})
          profiles = fp.get("profiles", [])
          prof = profiles[0] if profiles else {}
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"browser_version={prof.get('browser_version', 'unknown')}\n")
              f.write(f"capture_time={prof.get('capture_time', 'unknown')}\n")
              f.write(f"major={prof.get('major', 'unknown')}\n")
              f.write(f"reference_age_days={prof.get('reference_age_days', '')}\n")
          print(f"final verdict={verdict} report={path}")
          PY

      # ── Report infrastructure skip (skip on both attempts) ─────────────
      - name: Report infrastructure skip
        if: steps.final.outputs.verdict == 'skip'
        run: |
          {
            echo "## Fingerprint oracle — infrastructure skip"
            echo ""
            echo "An echo endpoint (tls.peet.ws or tls.browserleaks.com) was"
            echo "unreachable or returned an unparseable response. This is"
            echo "**NOT** fingerprint drift — \`doctor\` reported \`skip\`."
            echo ""
            echo "### Attempt 1 stderr (last 30 lines)"
            echo '```'
            tail -30 /tmp/doctor1.stderr.log || true
            echo '```'
            echo ""
            echo "### Attempt 2 stderr (last 30 lines)"
            echo '```'
            tail -30 /tmp/doctor2.stderr.log 2>/dev/null || echo "(no attempt 2)"
            echo '```'
            echo ""
            echo "No drift issue filed. The oracle will retry next week (or on"
            echo "manual dispatch via the Actions tab)."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Ensure labels exist ───────────────────────────────────────────
      - name: Ensure labels exist
        if: steps.final.outputs.verdict == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "fingerprint-drift" --description "Scheduled fingerprint oracle detected TLS/HTTP2/header emulation drift" --color "D93F0B" --if-not-exists 2>/dev/null || true
          gh label create "followup" --description "Followup item from a review or scheduled check" --color "FBCA04" --if-not-exists 2>/dev/null || true

      # ── File or update drift issue (verdict == fail) ───────────────────
      #
      # The drifted fields come from the structured JSON (`hard_failures`
      # with expected/observed per field), not from grepping stderr. Token:
      # GITHUB_TOKEN (issues need no App token — see release-please.yml note).
      - name: File or update drift issue
        if: steps.final.outputs.verdict == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT="${{ steps.final.outputs.report }}"
          BROWSER_VERSION="${{ steps.final.outputs.browser_version }}"
          CAPTURE_TIME="${{ steps.final.outputs.capture_time }}"
          MAJOR="${{ steps.final.outputs.major }}"
          AGE_DAYS="${{ steps.final.outputs.reference_age_days }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Build the drift-details block + freshness note from the JSON.
          python3 - "$REPORT" "$AGE_DAYS" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          age_days = sys.argv[2]
          fp = next((c for c in report.get("checks", []) if c.get("name") == "fingerprint"), {})
          lines = []
          for prof in fp.get("profiles", []):
              if prof.get("status") != "fail":
                  continue
              lines.append(f"Chrome {prof.get('major')}: observed JA4={prof.get('ja4')}, reference JA4={prof.get('reference_ja4')}")
              for hf in prof.get("hard_failures", []):
                  lines.append(f"  FIELD {hf['field']}")
                  lines.append(f"    expected: {hf['expected']}")
                  lines.append(f"    observed: {hf['observed']}")
              for g in prof.get("gap_closed", []):
                  lines.append(f"  GAP-CLOSED {g}")
          out = "\n".join(lines) if lines else "(no failed fields in JSON — see full report below)"
          with open("/tmp/drift_details.txt", "w") as f:
              f.write(out)
          if age_days and age_days != "":
              if int(age_days) > 90:
                  note = f"> ⚠️ Reference is **{age_days} days old** — drift may indicate a stale reference (Chrome has moved on) rather than an ox-browser regression. Consider re-capturing from go-stealth's \`cmd/fingerprint-capture\`."
              else:
                  note = f"> Reference age: **{age_days} days** — within freshness window; drift is most likely an ox-browser regression."
          else:
              note = "> Reference age: unknown."
          with open("/tmp/freshness_note.txt", "w") as f:
              f.write(note)
          PY

          DRIFT_DETAILS=$(cat /tmp/drift_details.txt)
          FRESHNESS_NOTE=$(cat /tmp/freshness_note.txt)

          # Search for an existing OPEN drift issue to avoid weekly duplicates.
          EXISTING=$(gh issue list --label "fingerprint-drift" --state open --json number --jq '.[0].number' 2>/dev/null || true)

          BODY=$(cat <<EOF
          ## Fingerprint oracle drift detected

          **Run**: ${RUN_URL}
          **Binary**: released \`ox-browser\` (latest GitHub release, aarch64)
          **Reference**: Chrome **${BROWSER_VERSION}** (major ${MAJOR}), captured ${CAPTURE_TIME} (${AGE_DAYS} days old)

          ${FRESHNESS_NOTE}

          ### Drifted fields

          \`\`\`
          ${DRIFT_DETAILS}
          \`\`\`

          ### Full doctor JSON

          \`\`\`json
          $(cat "${REPORT}")
          \`\`\`

          ---

          *Filed/updated by the scheduled fingerprint oracle workflow (issue #109). The verdict comes from \`ox-browser doctor --json\` — do not weaken assertions to make this green; fix the emulation profile in \`crates/http/src/tls.rs\` or re-capture the reference.*
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            {
              echo "## Fingerprint oracle — drift detected"
              echo ""
              echo "Updated existing issue [#${EXISTING}](${{ github.server_url }}/${{ github.repository }}/issues/${EXISTING}) with this run's drift details."
              echo ""
              echo "**Reference**: Chrome ${BROWSER_VERSION} (${AGE_DAYS} days old)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            ISSUE_URL=$(gh issue create \
              --title "Fingerprint oracle drift — Chrome ${BROWSER_VERSION} reference" \
              --body "$BODY" \
              --label "fingerprint-drift" \
              --label "followup")
            {
              echo "## Fingerprint oracle — drift detected"
              echo ""
              echo "Filed new issue: ${ISSUE_URL}"
              echo ""
              echo "**Reference**: Chrome ${BROWSER_VERSION} (${AGE_DAYS} days old)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Pass/warn: close stale drift issue + summary ───────────────────
      - name: Pass/warn — close stale drift issue + summary
        if: steps.final.outputs.verdict == 'pass' || steps.final.outputs.verdict == 'warn'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If a previous run filed a drift issue and this run does not fail,
          # the drift is resolved — close it so the issue tracker reflects reality.
          EXISTING=$(gh issue list --label "fingerprint-drift" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "doctor reported \`${{ steps.final.outputs.verdict }}\` on $(date -u +%Y-%m-%dT%H:%M:%SZ). Closing — drift resolved."
            gh issue close "$EXISTING"
            echo "Closed resolved drift issue #${EXISTING}." >> "$GITHUB_STEP_SUMMARY"
          fi
          LABEL_WORD="passed"
          if [ "${{ steps.final.outputs.verdict }}" = "warn" ]; then
            LABEL_WORD="passed with warnings"
          fi
          {
            echo "## Fingerprint oracle — ${LABEL_WORD}"
            echo ""
            echo "All fingerprint fields match the reference."
            echo ""
            echo "**Reference**: Chrome ${{ steps.final.outputs.browser_version }}, captured ${{ steps.final.outputs.capture_time }} (${{ steps.final.outputs.reference_age_days }} days old)"
            echo "**Verdict**: \`${{ steps.final.outputs.verdict }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
